<figure><img src="figures/symmetry_metric_planes.png" alt="15 reflection planes"><figcaption>Fig. 1 — The icosahedral platform and its symmetry metric: a three-legged candidate against the 15 reflection planes, each labeled with its face-placement score F and motor-level score J (P7: F=0, J=0 is the symmetric plane).</figcaption></figure>
<figure><img src="figures/bodies_merged_3x4.png" alt="bodies"><figcaption>Fig. 2 — Top: candidates evolving in the abstract simulator. Middle: champions evolved in the realistic simulator (tripod, (3,3,3,3), (4,4,2,2), (3,3,2,2,2)) at their solved stance. Bottom: the tripod and (3,3,3,3) champions walking on 30 mm terrain with policies trained on it.</figcaption></figure>
<figure><img src="figures/drift_merged_6x2.png" alt="symmetry drift"><figcaption>Fig. 3 — Symmetry of the elites per generation (F left, J right; lower = more symmetric). Red: abstract mixed competition; green: abstract speciated evolution; blue: realistic simulator. Regression with 95% CI; dashed: species-matched drift baseline.</figcaption></figure>
<figure><img src="figures/v6_ea_fitness.png" alt="EA fitness"><figcaption>Fig. S2 — Mixed competition: displacement of every trained candidate per generation, by leg count, with best and mean elite.</figcaption></figure>
<figure><img src="figures/v6_ea_partitions.png" alt="partition share"><figcaption>Fig. S3 — Mixed competition: share of the elite slots per topology and per leg count; tripods hold every slot from generation 31.</figcaption></figure>
